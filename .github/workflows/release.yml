name: Release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml, .github/workflows/windows-desktop.yml, scripts/windows/**, public/language.js, lib/help-language.mjs, lib/help-translation-worker.cjs, scripts/prepare_translation_model.mjs, assets/help-*.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  windows-desktop:
    uses: ./.github/workflows/windows-desktop.yml
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ausgewählten Python-Interpreter verwenden
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('AP_BRIDGE_PYTHON=' + sys.executable + '\n')
      - name: Große APworlds vorbereiten
        run: python scripts/prepare_large_apworlds.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install PyYAML==6.0.3
      - run: npm ci --ignore-scripts
      - name: Lokales Übersetzungsmodell mit SHA256 prüfen und vorbereiten
        run: node scripts/prepare_translation_model.mjs
      - name: Module, HTTP und Oberfläche prüfen
        run: npm test
      - run: npm run check
  core-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 54803be064fc7e80c4628777ed0b46a9390f255f
          path: .core-archipelago
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: python -m pip install -r scripts/requirements-core-cache.txt
      - name: Offizielle Core-Einstellungen reproduzieren
        run: |
          python scripts/build_core_cache.py --archipelago .core-archipelago
          git diff --exit-code -- assets/core-world-settings.json
      - name: Exportierte Core-YAMLs mit Archipelago prüfen
        run: npm run validate:core -- --archipelago .core-archipelago
      - name: ADMIN-Zuschauer in echtem Seed mit parallelen Spielclients prüfen
        run: python scripts/validate_admin_slot.py --archipelago .core-archipelago
      - name: Große Nutzer-Worlds vorbereiten
        run: python scripts/prepare_large_apworlds.py
      - name: Neue Nutzer-YAMLs mit originalen Optionstypen prüfen
        run: npm run validate:user-worlds -- --archipelago .core-archipelago
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, core-options, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime
          path: assets/windows
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ausgewählten Python-Interpreter verwenden
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('AP_BRIDGE_PYTHON=' + sys.executable + '\n')
      - name: Große APworlds vorbereiten
        run: python scripts/prepare_large_apworlds.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Release-Version prüfen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt"; then
            if [[ $(cat "$RUNNER_TEMP/release-draft.txt") == false ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: npm ci --omit=dev --ignore-scripts
        if: steps.version.outputs.exists != 'true'
      - run: python -m pip install PyYAML==6.0.3
        if: steps.version.outputs.exists != 'true'
      - run: npm run validate:worlds -- --pyyaml
        if: steps.version.outputs.exists != 'true'
      - name: Vollständiges Programmpaket und Quellcode bauen
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist
          python3 scripts/package_release.py "dist/AP-Chaos-Bridge-v$RELEASE_VERSION.zip"
          python3 scripts/package_release.py "dist/AP-Chaos-Bridge-v$RELEASE_VERSION-source.zip" --source
          cp APWORLDS-MANUELL.md dist/
          cd dist
          sha256sum *.zip APWORLDS-MANUELL.md > SHA256SUMS.txt
      - name: Release mit geprüften Downloads veröffentlichen
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "AP Chaos Bridge $RELEASE_VERSION" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
