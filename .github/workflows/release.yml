name: Release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install PyYAML==6.0.3
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Release-Version prüfen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt"; then
            if [[ $(cat "$RUNNER_TEMP/release-draft.txt") == false ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: npm ci --omit=dev --ignore-scripts
        if: steps.version.outputs.exists != 'true'
      - run: python -m pip install PyYAML==6.0.3
        if: steps.version.outputs.exists != 'true'
      - run: npm run validate:worlds -- --pyyaml
        if: steps.version.outputs.exists != 'true'
      - name: Vollständiges Programmpaket und Quellcode bauen
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist
          python3 scripts/package_release.py "dist/AP-Chaos-Bridge-v$RELEASE_VERSION.zip"
          python3 scripts/package_release.py "dist/AP-Chaos-Bridge-v$RELEASE_VERSION-source.zip" --source
          cp APWORLDS-MANUELL.md dist/
          cd dist
          sha256sum *.zip APWORLDS-MANUELL.md > SHA256SUMS.txt
      - name: Release mit geprüften Downloads veröffentlichen
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "AP Chaos Bridge $RELEASE_VERSION" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
